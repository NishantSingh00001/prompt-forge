<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Diff — PromptForge</title><meta name="description" content="Compare two prompt versions and see which cases improved and which regressed.">
<link rel="stylesheet" href="core.css"><link rel="stylesheet" href="app.css"></head><body><div id="topbar"></div>
<main class="shell page">
  <header class="phead"><div class="eyebrow">Version diff</div><h1>What did it <em>break</em>?</h1><p class="lede">Compare any two versions on the same dataset. Green = newly fixed, red = newly broken — the regressions a single pass-rate number hides.</p>
    <select class="inp" id="psel" style="max-width:260px;margin-top:16px"></select></header>
  <div class="row" style="gap:30px;margin-bottom:18px"><div><div class="il" style="font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:8px">Baseline (A)</div><div class="seg" id="aseg"></div></div><div><div class="il" style="font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:8px">Candidate (B)</div><div class="seg" id="bseg"></div></div></div>
  <div class="bigstats" id="summary"></div>
  <div class="card reveal" style="padding:24px;margin-top:4px"><div class="ch" style="padding:0 0 15px"><h2>Case-by-case</h2><span class="k" id="verdict"></span></div><div id="difftable" style="margin-top:16px"></div></div>
</main><script src="three.min.js"></script><script src="app.js"></script><script src="core.js"></script></body></html>
